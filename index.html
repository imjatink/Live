<html lang="en"><head><meta charset="utf-8"><title>Unscripted Journeys – Travel Price Live</title>

<style>
:root{--gold:#d8bd86;--mut:rgba(255,255,255,.62);--glass:rgba(9,12,20,.55);--ok:#9be3b8}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:Inter,'Helvetica Neue',Arial,sans-serif;color:#fff;overflow:hidden;font-variant-numeric:tabular-nums lining-nums}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;background-size:cover;background-position:center}
.bg.on{opacity:1}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6) 0,rgba(0,0,0,.08) 26%,rgba(0,0,0,.1) 55%,rgba(0,0,0,.78) 100%)}
.live{position:absolute;left:44px;top:36px;font-weight:600;font-size:18px;letter-spacing:.22em;display:flex;align-items:center;gap:10px}
.live i{width:12px;height:12px;border-radius:50%;background:#e5484d;animation:p 1.8s infinite}
@keyframes p{50%{opacity:.25}}
.meta{position:absolute;left:44px;top:72px;font-size:15px;font-weight:300;color:var(--mut);line-height:1.7}
.brand{position:absolute;right:44px;top:34px;text-align:right;font:600 24px 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;opacity:.9}
.brand small{display:block;font:300 13px Inter,Arial;letter-spacing:.2em;color:var(--mut);margin-top:2px}
.head{position:absolute;top:22px;left:0;right:0;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.65)}
#city{font:600 112px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.16em;padding-left:.16em}
#country{font:400 28px Inter,Arial;letter-spacing:.34em;margin-top:10px;padding-left:.34em}
.c{transition:opacity .6s}.c.out{opacity:0}
.panel{position:absolute;top:190px;width:540px;height:540px;display:flex;flex-direction:column;box-sizing:border-box;background:var(--glass);backdrop-filter:blur(14px);border-radius:20px;padding:26px 30px}
#hotels{left:44px}#flights{right:44px}
.panel h2{margin:0 0 18px;font:500 15px Inter,Arial;letter-spacing:.3em;color:var(--gold)}
.cat{flex:1;display:flex;flex-direction:column;justify-content:center;border-top:1px solid rgba(255,255,255,.1)}.cat:first-of-type{border-top:0}
.cat h3{margin:0 0 6px;font:400 14px Inter,Arial;letter-spacing:.12em;color:var(--mut)}
.row{display:flex;align-items:center;height:38px;gap:12px;font-size:17px;font-weight:400}
.row .n{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{color:var(--gold);font-size:15px;width:48px;margin-left:auto;text-align:right}
.row .p{width:128px;text-align:right;font-weight:500;font-size:19px;white-space:nowrap}
.row .p small{font-size:13px;font-weight:300;color:var(--mut)}
.low{color:var(--ok)}.tag{flex:none;display:inline-block;margin-left:2px;font:500 10px Inter;letter-spacing:.12em;border:1px solid var(--ok);color:var(--ok);padding:2px 6px;border-radius:20px;vertical-align:middle}
.fh,.fr{display:grid;grid-template-columns:150px 1fr 1fr 1fr;align-items:center}
.fh{font:400 13px Inter;letter-spacing:.14em;color:var(--mut);margin-bottom:6px}
.fr{flex:1;border-top:1px solid rgba(255,255,255,.1)}
.fr.home{opacity:.4}
.ap b{display:block;font:600 26px 'Cormorant Garamond',Georgia,serif;letter-spacing:.08em}
.ap span{font-size:13px;font-weight:300;color:var(--mut)}
.fr .f{font-size:21px;font-weight:500}
.fr .f small{display:block;font-size:12px;line-height:15px;height:15px;font-weight:300;color:var(--mut);margin-top:2px;white-space:nowrap}
.fr .f b{display:inline-block;padding:3px 10px;margin-left:-10px;border-radius:20px;font-weight:500;line-height:1.2}.fr .f.best b{color:#0c1018;background:var(--ok);font-weight:600}
.trip{position:absolute;left:0;right:0;top:782px;text-align:center}
.trip h2{margin:0 0 16px;font:500 16px Inter;letter-spacing:.34em;color:var(--gold);text-shadow:0 2px 12px #000}
.cards{display:flex;justify-content:center;gap:26px}
.card{width:400px;padding:20px 0 18px;background:var(--glass);backdrop-filter:blur(14px);border-radius:20px}
.card.mid{background:rgba(44,35,14,.68)}
.card em{display:block;font:500 15px Inter;font-style:normal;letter-spacing:.3em;color:var(--gold)}
.card small{display:block;font-size:13px;font-weight:300;color:var(--mut);margin:4px 0 4px}
.card b{display:block;font:500 70px/1.05 Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:-.02em}.card .pp{display:block;margin-top:6px;font:400 12px Inter;letter-spacing:.24em;color:var(--mut)}
.avg{margin-top:20px;font:400 22px Inter;letter-spacing:.16em;text-shadow:0 2px 12px #000}
.avg b{font:600 34px 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em;margin-left:10px}
.note{font-size:12px;font-weight:300;color:var(--mut);margin-top:6px;letter-spacing:.04em}
.flag{border-radius:3px;vertical-align:middle;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.next{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:center;gap:18px;font:500 14px Inter;letter-spacing:.24em}.next .l{font-weight:300;color:var(--mut)}.next .c{display:flex;align-items:center;gap:10px}
.bar{position:relative;width:260px;height:4px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transform-origin:left;animation:fill 16s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

const IC={},WK={'New York':'New_York_City','Marrakech':'Marrakesh','Cancun':'Cancún','Reykjavik':'Reykjavík'};
const flagImg=(cc,h)=>{h=h||18;return FLAGS[cc]?`<img class="flag" style="height:${h}px;width:${h*1.5}px" src="${FLAGS[cc]}" alt="">`:cc.toUpperCase()};
const loadable=(u,min)=>new Promise(r=>{if(!u)return r(null);const i=new Image();i.onload=()=>r(!min||i.naturalWidth>=min?u:null);i.onerror=()=>r(null);i.src=u});
function getImg(c){return IC[c.slug]||(IC[c.slug]=(async()=>{
 let u=await loadable('photos/'+c.slug+'.jpg');if(u)return u;
 const t=(WK[c.city]||c.city).replace(/ /g,'_');
 try{const j=await(await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=1920&redirects=1&format=json&origin=*&titles='+encodeURIComponent(t))).json();
  const p=Object.values(j.query.pages)[0];if(p.thumbnail){u=await loadable(p.thumbnail.source,1000);if(u)return u}}catch(e){}
 return null})())}
async function setBg(c){const u=await getImg(c),n=$('b'+(1-bgOn));n.style.backgroundImage=u?`url("${u}")`:fallback(c);n.classList.add('on');$('b'+bgOn).classList.remove('on');bgOn=1-bgOn}
function bar(){const b=$('barfill');b.style.animation='none';b.offsetWidth;b.style.animation=''}
function hotels(c){let h='<h2>HOTEL PRICES · USD</h2>';
 [5,4,3].forEach(s=>{const l=c.hot[s],min=Math.min(...l.map(x=>x[2]));h+=`<div class="cat"><h3>${s}-star hotels</h3>`;
  for(let k=0;k<3;k++){const x=l[k],lo=x[2]==min;h+=`<div class="row"><span class="n">${x[0]}</span>${lo?'<span class="tag">LOWEST</span>':''}<span class="r">★ ${x[1]}</span><span class="p ${lo?'low':''}">${fm(x[2])}<small>/night</small></span></div>`}
  h+='</div>'});$('hotels').innerHTML=h}
function flights(c){const F=fares(c),ok=F.filter(Boolean),best=[0,1,2].map(k=>Math.min(...ok.map(r=>r[k])));
 let h='<h2>FLIGHT PRICES · ROUND TRIP · USD</h2><div class="fh"><span></span><span>ECONOMY</span><span>PREMIUM</span><span>BUSINESS</span></div>';
 ORIG.forEach((o,i)=>{const r=F[i];h+=`<div class="fr ${r?'':'home'}"><div class="ap"><b>${flagImg(o[0])} ${o[2]}</b><span>${o[1]}</span></div>`+(r?[0,1,2].map(k=>`<div class="f ${r[k]==best[k]?'best':''}"><b>$${r[k].toLocaleString('en-US')}</b><small>${k==0?o[3]+' · ':''}${r[3]==0?'Nonstop':r[3]+(r[3]>1?' stops':' stop')}</small></div>`).join(''):'<div class="f" style="grid-column:span 3">Home city</div>')+'</div>'});
 $('flights').innerHTML=h}
function trip(c){const ok=fares(c).filter(Boolean),T=[['BUDGET','3-star hotel + Economy',3,0],['COMFORT','4-star hotel + Premium Economy',4,1],['LUXURY','5-star hotel + Business',5,2]];
 const v=T.map(t=>{const hp=c.hot[t[2]].reduce((a,x)=>a+x[2],0)/3,fl=ok.reduce((a,r)=>a+r[t[3]],0)/ok.length;return hp*6/2+fl+DAILY[t[3]]*6});
 $('trip').innerHTML=`<h2>ESTIMATED 6-NIGHT HOLIDAY COST · USD</h2><div class="cards">`+T.map((t,i)=>`<div class="card ${i==1?'mid':''}"><em>${t[0]}</em><small>${t[1]}</small><b>${fm(v[i])}</b><span class="pp">PER PERSON</span></div>`).join('')+`</div>`}
function render(){const c=CITIES[ci];$('city').textContent=c.city.toUpperCase();$('country').innerHTML=c.country.toUpperCase()+'<span style="display:inline-block;width:22px"></span>'+flagImg(c.flag,26);const nx=CITIES[(ci+1)%CITIES.length];getImg(nx);$('nxt').innerHTML=nx.city.toUpperCase()+' '+flagImg(nx.flag,16);
 $('ctr').textContent='CITY '+String(ci+1).padStart(2,'0')+' / '+CITIES.length;hotels(c);flights(c);trip(c)}
function go(){bar();const els=document.querySelectorAll('.c');els.forEach(e=>e.classList.add('out'));ci=(ci+1)%CITIES.length;off=0;setBg(CITIES[ci]);setTimeout(()=>{render();els.forEach(e=>e.classList.remove('out'))},700)}
function tick(){$('clock').textContent=new Date().toLocaleString('en-CA',{dateStyle:'full',timeStyle:'short'})}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$('stage');st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1920*s)/2+'px';st.style.top=(innerHeight-1080*s)/2+'px'}
addEventListener('resize',fit);fit();setBg(CITIES[0]);render();bar();tick();setInterval(tick,30000);
$('upd').textContent='Last updated '+new Date().toLocaleTimeString('en-CA',{timeStyle:'short'});
setInterval(go,16000);
</script></body></html>
